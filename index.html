k Russian."},{kind:"ex",ru:"Анна любит музыку.",en:"Anna loves music."},{kind:"p",text:"Negation is made by simply putting 'не' before the word being negated."},{kind:"ex",ru:"Я не понимаю.",en:"I don't understand."},{kind:"ex",ru:"Это не проблема.",en:"That is not a problem."}]},{id:"genders",title:"Noun Gender (Masculine, Feminine, Neuter)",intro:"Look at the ending of a noun to instantly know its gender.",subtitle:"Every Russian noun has a gender: Masculine, Feminine, or Neuter.",parts:[{kind:"table",headers:["Gender","Ending","Examples"],rows:[["Masculine","Hard consonant or -й","дом (house), музей (museum), брат (brother)"],["Feminine","-а, -я, or -ь","мама (mom), земля (earth), ночь (night)"],["Neuter","-о, -е, or -мя","окно (window), море (sea), время (time)"]]},{kind:"p",text:"Knowing the gender is crucial because adjectives, pronouns, past tense verbs, and case endings agree with the noun's gender!"},{kind:"ex",ru:"красивый дом",en:"a beautiful house (masculine)"},{kind:"ex",ru:"красивая машина",en:"a beautiful car (feminine)"},{kind:"ex",ru:"красивое окно",en:"a beautiful window (neuter)"}]},{id:"cases",title:"The 6 Russian Cases",intro:"The core engine of Russian grammar.",subtitle:"Noun endings change based on their role in the sentence.",parts:[{kind:"table",caption:"Overview of Russian Cases",headers:["Case","Question","Main Usage","Example"],rows:[["1. Nominative (Именительный)","Кто? Что?","Subject of sentence","Это **друг**."],["2. Accusative (Винительный)","Кого? Что?","Direct object, destination","Я вижу **друга**."],["3. Genitive (Родительный)","Кого? Чего?","Possession, absence ('no'), quantities","У меня нет **друга**."],["4. Dative (Дательный)","Кому? Чему?","Indirect object ('to someone'), age","Я звоню **другу**."],["5. Instrumental (Творительный)","Кем? Чем?","Means ('with/by'), professions","Я с **другом**."],["6. Prepositional (Предложный)","О ком? О чём?","Location ('in/at'), topic ('about')","Мы говорим о **друге**."]]},{kind:"p",text:"
